<body style="overflow:hidden">
<div id="pasture-viewport" aria-label="Pasture — drag to move, pinch to zoom"></div>
<button id="open-horse-book" class="book-toggle" type="button" aria-haspopup="dialog" aria-controls="horse-book"><span aria-hidden="true">📖</span>Horses book</button>
<dialog id="horse-book" class="horse-book" aria-labelledby="horse-book-title">
<div class="book-page">
<button id="close-horse-book" class="book-close" type="button" aria-label="Zamknij książkę koni" autofocus>×</button>
<header class="book-header"><p>Poznaj swoich przyjaciół</p><h1 id="horse-book-title">horses book</h1><span id="horse-count" aria-live="polite">0 / 8</span></header>
<ul id="horse-list"></ul>
<button id="unlock-horse" type="button" disabled>Ładowanie koni…</button>
</div>
</dialog>
<section class="care-panel" aria-label="Opieka nad końmi">
<p class="care-hint" id="care-hint" role="status">Konie powiedzą, czego potrzebują. Dotknij konia lub dymku!</p>
<div class="care-actions">
<div class="care-action"><span aria-hidden="true">🤚</span>Głaskanie<small>Prośby: <b data-count="pet">0</b></small></div>
<div class="care-action"><span aria-hidden="true">🪮</span>Szczotka<small>Prośby: <b data-count="brush">0</b></small></div>
<div class="care-action"><span aria-hidden="true">🥕</span>Karmienie<small>Prośby: <b data-count="feed">0</b></small></div>
<div class="care-action"><span aria-hidden="true">📷</span>Zdjęcie<small>Prośby: <b data-count="photo">0</b></small></div>
</div>
</section>
